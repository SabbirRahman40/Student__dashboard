name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Check project files
        shell: bash
        run: |
          set -e
          test -f main.py
          test -f buildozer.spec

          python -m py_compile main.py

          JSON_FILES=$(find . -maxdepth 1 -type f -name '*.json')
          if [ -z "$JSON_FILES" ]; then
            echo "ERROR: No JSON data file found in the project root."
            exit 1
          fi

          while IFS= read -r file; do
            python -m json.tool "$file" > /dev/null
            echo "Valid JSON: $file"
          done <<< "$JSON_FILES"

      - name: Clear old Buildozer cache
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sabbir-Smart-Student-Dashboard-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
