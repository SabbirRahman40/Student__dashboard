
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake gettext libltdl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Verify project files
        run: |
          test -f main.py
          test -f student_data.json
          test -f buildozer.spec
          python -m py_compile main.py
          python -m json.tool student_data.json > /dev/null
          echo "Project files verified successfully."

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          buildozer -v android debug 2>&1 | tee logs/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-build-log
          path: logs/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
