name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer and Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer"

      - name: Verify project files and Python syntax
        run: |
          test -f main.py
          test -f student_data.json
          test -f buildozer.spec
          python -m py_compile main.py
          python -m json.tool student_data.json > /dev/null

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # Buildozer downloads/configures its Android SDK during the build.
          # Accept licenses if sdkmanager is already available; Buildozer's
          # own license option is also enabled in buildozer.spec.
          set +e
          SDKMANAGER="$(find "$HOME/.buildozer" "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
            -type f -path '*/bin/sdkmanager' 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
            true
          fi
          exit 0
    
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          yes | buildozer -v android debug
          build_status=${PIPESTATUS[1]}
          if [ "$build_status" -ne 0 ]; then
            echo "Buildozer failed with exit code $build_status"
            exit "$build_status"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
